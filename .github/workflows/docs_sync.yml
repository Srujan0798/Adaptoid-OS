name: Docs Sync & Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run dogfood
        run: bash validators/dogfood.sh
      - name: Run preflight
        run: bash validators/preflight.sh .
