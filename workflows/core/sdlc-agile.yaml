# Agile SDLC workflow — default for Adaptoid Core (T1+)
# Each wave is a thin vertical slice; stages are gates, not paperwork.
name: sdlc-agile
version: "5.1"
description: >
  Plan → requirements → design (light) → build → test → deploy/ship → maintain.
  Agile: repeat per wave. Waterfall only when tier/compliance forces it.

methodology: agile   # agile | waterfall | devops
reference: protocols/sdlc-loop.md

# Full matrix: core/SHIP-SYSTEM.md (GFG SDLC × Grok/Claude toolkit)
stages:
  - id: plan
    sdlc: [1]
    host: [plan_mode, deep_reasoning, web_search]
    artifacts: [PROJECT-INTENT.md]
    gate: "feasibility + scope + tier"
  - id: requirements
    sdlc: [2]
    host: [plan_mode, subagents, web_search, mcp]
    artifacts: [PROJECT-INTENT.md success_criteria]
    gate: "testable criteria + OUT box"
  - id: design
    sdlc: [3]
    host: [plan_mode, code_search]
    artifacts: [plan/design.md, task writes]
    gate: "HLD/LLD-light for this wave"
  - id: build
    sdlc: [4]
    host: [terminal, multi_file_edits, code_search, git, skills, sandbox]
    artifacts: [src/]
    gate: "code in writes only"
  - id: test
    sdlc: [5]
    host: [terminal, subagents, background_tasks]
    artifacts: [tests/, reports]
    gate: "acceptance exit 0"
  - id: deploy
    sdlc: [6]
    host: [terminal, headless_ci, git, hooks, mcp]
    artifacts: [preflight PASS]
    gate: "bash orchestrator/scripts/preflight.sh ."
  - id: maintain
    sdlc: [7]
    host: [memory_handoff, plan_mode, code_search]
    artifacts: [HANDOFF.md rewritten]
    gate: "next wave clear"

wave_default:
  name: wave-1
  slice: "smallest vertical feature that proves the product"
  tasks: [01-plan, 02-requirements, 03-design, 04-build, 05-test, 06-deploy, 07-maintain]
