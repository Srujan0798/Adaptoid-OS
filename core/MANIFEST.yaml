# Adaptoid Core — the minimal harness that must ship with every project.
# Pro = this repo. Lite = reference/OS_SETUP_v1.3_full.md.
# Engine --core-only copies only what is listed here.

version: "5.1"
name: adaptoid-core

# Always load (~2K tokens). Copied into every generated project.
kernel:
  - kernel/PRINCIPLES.md
  - kernel/TWO-TIER.md
  - kernel/ANTI-HALLUCINATION.md

# Cold-start + durable state contracts (generated or templated).
contracts:
  - AGENTS.md          # host-neutral cold start (also used by Codex/Cursor/Grok)
  - HANDOFF.md         # replace-not-append session state
  - PROJECT-INTENT.md  # typed intent + falsification
  - adaptoid.config.yaml
  - INDEX.md           # progressive disclosure map (core-sized)

# Policies (OAP / blast-radius defaults)
policies:
  - templates/root/policies/default.yaml

# Must-run validators — the ones that catch real ship-blockers.
# Full Pro kit has more (consciousness, evolution, etc.).
validators:
  - preflight.sh
  - validate_state.sh
  - check_handoff.sh
  - check_status_claims.sh
  - check_silent_failures.sh
  - check_references.sh
  - check_intent.sh
  - check_scope.sh
  - publish_gate.sh
  - route_sentinel.sh
  - oap_security.sh
  - context_budget.sh
  - check_config.sh
  - check_tests.sh
  - check_metrics.sh
  - check_processes.sh
  - audit_chain.sh
  - vault_mmu.sh
  - wake.sh
  - emit_event.sh

# Host adapters: one source of truth → host-specific files.
# Engine --host emits the matching surface.
hosts:
  agents:
    description: "Host-neutral AGENTS.md (Codex, OpenCode, many CLIs)"
    files: [AGENTS.md]
  claude:
    description: "Claude Code CLAUDE.md + session-start hook"
    files: [CLAUDE.md, .claude/hooks/session-start.sh]
  cursor:
    description: "Cursor rules + AGENTS.md"
    files: [AGENTS.md, .cursor/rules/adaptoid.mdc]
  codex:
    description: "OpenAI Codex AGENTS.md"
    files: [AGENTS.md]
  grok:
    description: "Grok Build / xAI TUI AGENTS.md"
    files: [AGENTS.md]

# Product ladder
ladder:
  lite: "reference/OS_SETUP_v1.3_full.md — single pasteable file"
  core: "core/ — kernel + contracts + must-run validators + host emit"
  pro:  "this full repository — archetypes, FM library, workflows, v5 protocols"
