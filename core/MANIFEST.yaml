# Adaptoid product surfaces (authoritative)
# Lite = standalone md only. Core = entire this repository.

version: "5.2.1"
name: adaptoid

surfaces:
  lite: "ADAPTOID-LITE.md (repo root) — only standalone Lite"
  core: "this repository (engine, SHIP-SYSTEM, playbook, validators, …)"

ship_os: "core/SHIP-SYSTEM.md"   # SDLC × host toolkit

# Always load into generated Core projects (~2K tokens)
kernel:
  - kernel/PRINCIPLES.md
  - kernel/TWO-TIER.md
  - kernel/ANTI-HALLUCINATION.md

contracts:
  - AGENTS.md
  - CLAUDE.md          # when --host includes claude
  - HANDOFF.md
  - PROJECT-INTENT.md
  - adaptoid.config.yaml
  - SHIP-SYSTEM.md
  - INDEX.md

policies:
  - templates/root/policies/default.yaml

validators_core:
  - preflight.sh
  - validate_state.sh
  - check_handoff.sh
  - check_status_claims.sh
  - check_silent_failures.sh
  - check_references.sh
  - check_intent.sh
  - check_scope.sh
  - publish_gate.sh
  - route_sentinel.sh
  - oap_security.sh
  - context_budget.sh
  - check_config.sh
  - check_tests.sh
  - check_metrics.sh
  - check_processes.sh
  - audit_chain.sh
  - vault_mmu.sh
  - wake.sh
  - emit_event.sh

hosts:
  agents: [AGENTS.md]
  claude: [CLAUDE.md, .claude/hooks/session-start.sh]
  cursor: [AGENTS.md, .cursor/rules/adaptoid.mdc]
  codex: [AGENTS.md]
  grok: [AGENTS.md]
